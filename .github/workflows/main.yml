name: Flask CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Python (needed only if you want to run tests outside Docker)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t flask-app:latest .

      # 4. Run tests inside Docker
      - name: Run tests in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app flask-app:latest pytest test_app.py

      # 5. Optional: Run container for manual testing (remove deployment if not using Minikube)
      - name: Run Docker container
        run: |
          docker run -d --name flask-app-container -p 5000:5000 flask-app:latest

