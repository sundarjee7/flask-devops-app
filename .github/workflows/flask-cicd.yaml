name: Flask CI/CD Pipeline

# Trigger workflow on push to main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    # Use your self-hosted runner
    runs-on: self-hosted

    steps:
      # Step 1: Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Docker (self-hosted should already have Docker installed)
      - name: Build Docker image
        run: |
          docker build -t flask-app:1.0 .

      # Step 3: Apply Kubernetes manifests
      - name: Deploy to Minikube
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          kubectl apply -f flask-deployment.yaml
          kubectl apply -f flask-service.yaml

      # Step 4: Optional - verify pods are running
      - name: Check K8s pods
        run: kubectl get pods

      # Step 5: Optional - show service URL
      - name: Get service URL
        run: minikube service flask-app-service --url
