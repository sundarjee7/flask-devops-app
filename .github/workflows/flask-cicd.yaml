name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger pipeline on push to main branch

jobs:
  build-deploy:
    runs-on: self-hosted  # Use your self-hosted runner
    steps:
      # 1️⃣ Checkout the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker environment to point to Minikube
      - name: Configure Docker for Minikube
        run: |
          eval $(minikube -p minikube docker-env)
      
      # 3️⃣ Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t flask-app:latest .

      # 4️⃣ Apply Kubernetes manifests
      - name: Deploy to Minikube
        run: |
          kubectl apply -f flask-deployment.yaml
          kubectl apply -f flask-service.yaml

      # 5️⃣ Optional: Verify pods are running
      - name: Get Pods
        run: |
          kubectl get pods

